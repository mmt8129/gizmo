<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Not Uygulaması</title>
</head>
<body>

  <!-- Giriş Yapılmamışsa Görünecek Alan -->
  <div id="login-screen">
    <h2>Not Uygulamasına Hoş Geldiniz</h2>
    <button id="login-btn">Google ile Giriş Yap</button>
  </div>

  <!-- Giriş Yapıldıysa Görünecek Alan -->
  <div id="app-screen" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="user-info"></span>
      <button id="logout-btn">Çıkış Yap</button>
    </div>
    <hr>
    
    <!-- Not Ekleme Formu -->
    <input type="text" id="note-input" placeholder="Notunuzu yazın...">
    <button id="add-btn">Ekle</button>

    <!-- Not Listesi -->
    <ul id="notes-list"></ul>
  </div>

  <!-- Firebase Modül Kodları -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBqlA4yrw0rJZQyR3t6daJKru28EkmWhe4",
      authDomain: "khoj-smart.firebaseapp.com",
      databaseURL: "https://khoj-smart-default-rtdb.firebaseio.com",
      projectId: "khoj-smart",
      storageBucket: "khoj-smart.firebasestorage.app",
      messagingSenderId: "603123756358",
      appId: "1:603123756358:web:16ec68ba2872ae0436c947"
    };

    // Firebase Servislerini Başlatma
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // DOM Elemanları
    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app-screen');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userInfo = document.getElementById('user-info');
    const noteInput = document.getElementById('note-input');
    const addBtn = document.getElementById('add-btn');
    const notesList = document.getElementById('notes-list');

    let currentUser = null;
    let unsubscribeNotes = null;

    // 1. Google ile Giriş Yap
    loginBtn.addEventListener('click', () => {
      signInWithPopup(auth, provider).catch(error => console.error("Giriş Hatası:", error));
    });

    // 2. Çıkış Yap
    logoutBtn.addEventListener('click', () => {
      signOut(auth);
    });

    // 3. Oturum Durumu Takibi (Giriş Yapıldı mı / Yapılmadı mı?)
    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user;
        userInfo.textContent = `Giriş yapan: ${user.displayName}`;
        loginScreen.style.display = 'none';
        appScreen.style.display = 'block';
        loadNotes(user.uid);
      } else {
        currentUser = null;
        loginScreen.style.display = 'block';
        appScreen.style.display = 'none';
        notesList.innerHTML = '';
        if (unsubscribeNotes) unsubscribeNotes();
      }
    });

    // 4. Kullanıcıya Özel Notları Canlı Olarak Getir
    function loadNotes(uid) {
      const q = query(collection(db, "notes"), where("uid", "==", uid));
      
      unsubscribeNotes = onSnapshot(q, (snapshot) => {
        notesList.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const note = docSnap.data();
          const li = document.createElement('li');
          li.textContent = note.text + ' ';
          
          const delBtn = document.createElement('button');
          delBtn.textContent = 'Sil';
          delBtn.onclick = () => deleteDoc(doc(db, "notes", docSnap.id));
          
          li.appendChild(delBtn);
          notesList.appendChild(li);
        });
      });
    }

    // 5. Yeni Not Ekleme (Kullanıcı ID'si ile)
    addBtn.addEventListener('click', async () => {
      const text = noteInput.value.trim();
      if (text && currentUser) {
        await addDoc(collection(db, "notes"), {
          text: text,
          uid: currentUser.uid,
          createdAt: new Date()
        });
        noteInput.value = '';
      }
    });
  </script>
</body>
</html>
